[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
clap = "4.5"
config = { version = "0.15.9", features = ["toml"] }
diesel = { version = "2.2", features = ["postgres", "extras"] }
dotenvy = "0.15"
log = "0.4"
log4rs = "1.3"
tokio = { version = "1.44", features = ["full", "tracing"] }
